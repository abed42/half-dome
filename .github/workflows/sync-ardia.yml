name: Sync Ardia

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Ardia release tag to sync (empty = latest non-nightly)
        required: false
        type: string
  repository_dispatch:
    types: [ardia-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-ardia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SYNC_TOKEN:-}" ]]; then
            echo "SYNC_TOKEN secret is missing. Add a fine-grained PAT with Contents, Pull requests, and workflows permission." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: halfdome
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Ensure upstream remote
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ardia-browser/ardia.git
          git fetch upstream --tags --force
          git fetch origin halfdome --force
          git fetch origin 'refs/heads/sync/ardia-*:refs/remotes/origin/sync/ardia-*' 2>/dev/null || true

      - name: Resolve Ardia tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          elif [[ -n "${DISPATCH_TAG:-}" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          fi
          if [[ -z "$TAG" ]]; then
            echo "No Ardia release tag found" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Unknown tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using $TAG"

      - name: Open sync branch and merge
        id: merge
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "half-dome-sync"
          git config user.email "half-dome-sync@users.noreply.github.com"
          BRANCH="sync/ardia-$TAG"
          git checkout -B halfdome origin/halfdome

          if git merge-base --is-ancestor "$TAG" halfdome; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "halfdome already contains $TAG"
            exit 0
          fi

          if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null \
            && git merge-base --is-ancestor "$TAG" "origin/$BRANCH"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "sync branch $BRANCH already holds $TAG"
            exit 0
          fi

          echo "already=false" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH" halfdome

          if git merge --no-ff -m "Merge Ardia $TAG into halfdome" "$TAG"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            git push --force-with-lease origin "$BRANCH"
            {
              echo "## Sync Ardia \`$TAG\`"
              echo
              echo "Merged Ardia release \`$TAG\` into \`$BRANCH\` (merge commit, not a rebase)."
              echo "Review, then merge the PR into \`halfdome\`."
            } > /tmp/sync-body.md
            echo "body_file=/tmp/sync-body.md" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --abort
          echo "conflicts=true" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH" halfdome
          git commit --allow-empty -m "chore: flag Ardia $TAG sync conflicts"
          git push --force-with-lease origin "$BRANCH"
          {
            echo "## Sync blocked by conflicts"
            echo
            echo "Merge of \`$TAG\` into \`$BRANCH\` hit conflicts."
            echo "Run locally:"
            echo
            echo '```bash'
            echo "halfdome/scripts/sync-ardia.sh $TAG"
            echo '```'
          } > /tmp/sync-body.md
          echo "body_file=/tmp/sync-body.md" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.merge.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BODY_FILE: ${{ steps.merge.outputs.body_file }}
        run: |
          set -euo pipefail
          BRANCH="sync/ardia-$TAG"
          TITLE="Sync Ardia $TAG"
          if [[ "$CONFLICTS" == "true" ]]; then
            TITLE="Sync Ardia $TAG (conflicts — needs manual merge)"
          fi
          EXISTING="$(gh pr list --base halfdome --head "$BRANCH" --json number --jq '.[0].number')"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
          else
            gh pr create --base halfdome --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"
          fi
